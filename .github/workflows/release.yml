name: Release

# Builds a signed APK and publishes it as a GitHub Release. Two ways to start it:
#  - push a tag like v1.2.3, or
#  - "Run workflow" on main with a version; the tag is then created by this run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3 (creates tag v1.2.3 on main)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Releases are cut from main, not from $GITHUB_REF_NAME."
              exit 1
            fi
            version="${REQUESTED#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 1.2.3, got '$version'."
            exit 1
          fi
          # A manual run must not move or reuse an existing tag.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] &&
             git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. See docs/BUILDING.md, section 'Signing'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KH_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease -PappVersionName="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "kh-rechner-$VERSION.apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: kh-rechner-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
