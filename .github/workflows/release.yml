name: Release

# Push a tag like v1.2.3 to build a signed APK and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. See README, section 'Signing'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KH_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew testDebugUnitTest assembleRelease -PappVersionName="$version"
          cp app/build/outputs/apk/release/app-release.apk "kh-rechner-$version.apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: kh-rechner-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
